# Конфиг Hermes для gift-agent.
# При каждом `docker compose up` сервис hermes-init копирует этот файл в том
# hermes-data (/opt/data/config.yaml). Править здесь, а не внутри контейнера.

model:
  # DeepSeek напрямую: ключ DEEPSEEK_API_KEY в .env. Кэш контекста у DeepSeek
  # включается сам, повторяющееся начало контекста стоит в десятки раз дешевле.
  # Пиковые часы (цена x2): 01:00–04:00 и 06:00–10:00 UTC по будням.
  provider: deepseek
  # Flash: на сценарии «подбор → корзина → оформление на WB» справился, ~¥0.5 за
  # прогон (76 запросов, 7 млн токенов, почти всё из кэша).
  default: deepseek-flash
  # Альтернатива — свой OpenAI-совместимый эндпоинт (например, Cloud.ru):
  # provider: custom
  # default: "<имя модели>"
  # base_url: "${OPENAI_BASE_URL}"
  # api_key: "${OPENAI_API_KEY}"

# Запасная модель: Hermes переключается на неё, если основная недоступна
# (лимиты, ошибки сервера, отказ ключа). Активируется один раз за сессию.
# Сейчас — V4 Pro того же DeepSeek: выручит при перегрузке или лимитах Flash,
# но не при проблемах с ключом или балансом.
# Gemini API из России недоступен; кандидат на независимый запасной вариант —
# GigaChat API (Freemium для физлиц) через прокси gpt2giga.
fallback_providers:
  - provider: deepseek
    model: deepseek-v4-pro

agent:
  # Потолок шагов на одно сообщение. Защищает от зацикливания в браузере.
  max_turns: 60
  # Агенту с доступом к браузеру не нужны shell, исполнение кода и т.п.
  disabled_toolsets:
    - terminal
    - code_execution
    - computer_use
    - delegation
    - image_gen
    - video_gen
    # Встроенный браузер Hermes (в т.ч. browser_vault с паролями и картами) —
    # браузер даёт Playwright MCP.
    - browser
    # Веб-поиск в этой сборке нестабилен, а модель с ним обходит marketplace и
    # браузер. Товары ищем через marketplace, страницы смотрим через браузер.
    - web

tools:
  tool_search:
    # По умолчанию Hermes прячет инструменты MCP за tool_search / tool_call,
    # и модель должна сначала их найти. У нас инструментов немного, поэтому
    # выдаём их сразу: так модели проще и меньше лишних шагов.
    enabled: "off"

plugins:
  # checkout-guard (hermes/plugins/checkout-guard): кнопки подтверждения в Telegram
  # перед «Заказать» / «Оплатить», запрет на ввод номеров карт.
  enabled:
    - checkout-guard

approvals:
  # Сколько ждать ответа на кнопки подтверждения. Нет ответа = отказ.
  timeout: 600

skills:
  # Агент не меняет скиллы молча: любая запись — только с подтверждения.
  write_approval: true
  guard_agent_created: true

mcp_servers:
  marketplace:
    url: "http://marketplace:8000/mcp"
    headers:
      Authorization: "Bearer ${MARKETPLACE_MCP_TOKEN}"
      X-MCP-Tenant: "gift-agent"
    connect_timeout: 30
    timeout: 120

  # Браузер: Chrome на хосте через Playwright MCP -> cdp-proxy.
  playwright:
    url: "http://playwright:8931/mcp"
    connect_timeout: 30
    timeout: 120
    tools:
      # Произвольный код и загрузка файлов агенту не нужны.
      exclude:
        - browser_run_code_unsafe
        - browser_file_upload
        - browser_install
