# CDP-мост: контейнеры -> Chrome на хосте (127.0.0.1:9222).
#
# Chrome принимает CDP-запросы только с Host: localhost или IP и в ответах
# /json/* отдаёт ws-ссылки на тот адрес, который увидел в Host. Поэтому:
#   1) подменяем Host на localhost:9222 — Chrome принимает запрос;
#   2) переписываем ссылки в ответах на cdp-proxy:9222 — клиенты в контейнерах
#      подключаются обратно через этот же прокси;
#   3) убираем Origin — Chrome отклоняет WebSocket с чужим Origin.
# Порт наружу не опубликован: мост видят только сервисы этого compose.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9222;

    location / {
        proxy_pass http://host.docker.internal:9222;
        proxy_http_version 1.1;

        proxy_set_header Host localhost:9222;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout 1d;
        proxy_send_timeout 1d;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'localhost:9222' 'cdp-proxy:9222';
    }
}
